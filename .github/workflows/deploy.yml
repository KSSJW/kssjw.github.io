name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================
      # FuseLeaf
      # =========================

      - name: Install Astro dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      # =========================
      # WindSky
      # =========================

      - name: Install Docusaurus dependencies
        working-directory: windysky
        run: npm ci

      - name: Build Docusaurus
        working-directory: windysky
        run: npm run build

      # =========================
      # Merge
      # =========================

      - name: Prepare Pages
        run: |
          mkdir -p dist/windysky

          cp -r windysky/build/* dist/windysky/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4